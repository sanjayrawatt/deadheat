name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Real Postgres for the end-to-end tests, on the same port as docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deadheat
          POSTGRES_PASSWORD: deadheat
          POSTGRES_DB: deadheat
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U deadheat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # after build, so packages can see each other's emitted types
      - run: pnpm typecheck
      - run: pnpm test
