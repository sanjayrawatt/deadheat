# Local Postgres for the demo apps and Deadheat's integration tests.
# Port 55432 on the host avoids clashing with any Postgres already running on 5432/5433.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deadheat
      POSTGRES_PASSWORD: deadheat
      POSTGRES_DB: deadheat
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadheat"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
