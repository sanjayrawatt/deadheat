# Local Postgres for the demo apps and Deadheat's integration tests.
# Port 55432 on the host avoids clashing with any Postgres already running on 5432/5433.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deadheat
      POSTGRES_PASSWORD: deadheat
      POSTGRES_DB: deadheat
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadheat"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: network latency/jitter between a client and the API, for benchmarks only.
  # Start with: docker compose --profile bench up -d
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["bench"]
    ports:
      - "8474:8474" # control API
      - "4101:4101" # proxied booking-api
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
